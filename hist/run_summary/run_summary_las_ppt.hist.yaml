anchor:
 - &rf1 ["fmod(pla_las_3.fTiming-rf1.fTiming+1420.6750,142.06750)", 500, 0, 142.5]
 - &rf2 ["fmod(pla_las_3.fTiming-rf2.fTiming+1420.6750,142.06750)", 500, 0, 142.5]
 - &rf3 ["fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750)", 500, 0, 142.5]
 - &de1 ["pla_las_3.fCharge", 1000, 0, 5000]
 - &de1l ["pla_las_3l.fCharge", 1000, 0, 10000]
 - &de1r ["pla_las_3r.fCharge", 1000, 0, 10000] 
 - &xpos ["vdc_las.fX",600,-1000,1000]
 - &tdiff ["pla_las_3.GetTDiff()",1000,-40,0]
# - &tot ["Sum$(vdc_las_dt.fCharge)/(@vdc_las_dt.GetEntriesFast())",500,0,500]
 - &tot ["mean_tot_las.fCharge",500,0,500] 
# - &cut_rf "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-30)<25"
 - &cut_rf "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-32.5)<7.5"
# - &cut_rf_totveto "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-30)<25 && @vdc_las_dt.GetEntriesFast()==0"
 - &cut_rf_totveto "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-32.5)<7.5 && @vdc_las_dt.GetEntriesFast()==0"
 - &cut_totveto "@vdc_las_dt.GetEntriesFast()==0" 
# - &cut_rf_tot "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-30)<25 && Sum$(vdc_las_dt.fCharge)/(@vdc_las_dt.GetEntriesFast())>120"
 - &cut_rf_tot "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-32.5)<7.5 && mean_tot_las.fCharge>100"
 - &cut_rf_track "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-32.5)<7.5 && vdc_las@.GetEntriesFast()>0"
 - &cut_rf_tot_track "abs(fmod(pla_las_3.fTiming-rf3.fTiming+1420.6750,142.06750/2.0)-32.5)<7.5 && mean_tot_las.fCharge>100 && vdc_las@.GetEntriesFast()>0"
 
 - &cut_rf_d "abs(fmod(pla_las_3.fTiming-rf1.fTiming+1420.6750,142.06750/2.0)-40)<10"
 - &cut_rf_totveto_d "abs(fmod(pla_las_3.fTiming-rf1.fTiming+1420.6750,142.06750/2.0)-40)<10 && @vdc_las_dt.GetEntriesFast()==0"
 
