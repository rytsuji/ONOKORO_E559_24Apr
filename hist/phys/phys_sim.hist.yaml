anchor:
 - &sx ["226.0-pgr.fTKE-plas.fTKE", 1000, 0, 50]

 
group:
 - name: phys
   title: phys
   contents:

     - name: tke_las_gr
       title: Energy LAS-GR with True coin
       x: ["pgr.fTKE",  500, 100, 200]
       y: ["plas.fTKE", 500,   0, 100]
       
     - name: sx
       title: Sx with True coin
       x: *sx

     - name: tke_gr_sx_tc
       title: Energy GR vs SX  with True coin
       x: ["pgr.fTKE",  500, 100, 200]
       y: *sx

     - name: px_sx_tc
       title: Px vs SX  with True coin
       x: ["pgr.GetPx()+plas.GetPx()",200,-100,100]
       y: *sx

     - name: py_sx_tc
       title: Py vs SX  with True coin
       x: ["pgr.GetPy()+plas.GetPy()",200,-100,100]
       y: *sx
       
     - name: pz_sx_tc
       title: Pz vs SX  with True coin
       x: ["pgr.GetPz()+plas.GetPz()-688.71661",200,-100,100]
       y: *sx

     - name: p_sx_tc
       title: P vs SX  with True coin
       x: ["sqrt(pow(pgr.GetPx()+plas.GetPx(),2.0)+pow(pgr.GetPy()+plas.GetPy(),2.0)+pow(pgr.GetPz()+plas.GetPz()-688.71661,2.0))",150,0,150]
       y: *sx

     - name: p
       title: P 
       x: ["sqrt(pow(pgr.GetPx()+plas.GetPx(),2.0)+pow(pgr.GetPy()+plas.GetPy(),2.0)+pow(pgr.GetPz()+plas.GetPz()-688.71661,2.0))",150,0,150]
